name: Release

# Pushing a tag vX.Y.Z releases version X.Y.Z on GitHub, with frog.lua as its file: the tag must match pyproject.toml
# and frog.lua, and CHANGELOG.md must have notes for it. scripts/release.py prepares and pushes such a tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check the tag against the version
        run: |
          test "$GITHUB_REF_NAME" = "v$(uv version --short)"
          grep -q "^-- Version ${GITHUB_REF_NAME#v}, " SCRIPTS/TELEMETRY/frog.lua
      - run: uv run build.py
      - name: Generated files up to date
        run: test -z "$(git status --porcelain)"
      - name: Release notes from CHANGELOG.md
        run: |
          mkdir dist
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/ { on = index($0, "[" v "]") > 0; next } /^\[[^]]+\]: / { next } on' \
            CHANGELOG.md > dist/notes.md
          grep -q '[^[:space:]]' dist/notes.md
          cp SCRIPTS/TELEMETRY/frog.lua dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/frog.lua --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
